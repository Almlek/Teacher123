<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="purple" style="--fz: 24px; --ui-scale: 1;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#7C3AED">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>الذكي - دفتر التحضير الذكي</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* ====== الأساسيات ====== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Cairo', 'Tajawal', sans-serif;
            font-size: 14px;
            background: #f8fafc;
            color: #1e293b;
            min-height: 100vh;
            padding: 0;
            margin: 0;
        }
        /* ====== شريط التطبيق ====== */
        .appbar {
            background: linear-gradient(135deg, #7c3aed, #4c1d95);
            color: white;
            padding: 8px 12px;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.4);
            border-bottom: 2px solid rgba(255, 255, 255, 0.15);
        }
        .appbar-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: nowrap;
            overflow-x: auto;
        }
        .appbar-row::-webkit-scrollbar {
            display: none;
        }
        .appbar-title {
            font-size: 1.2rem;
            font-weight: 900;
            flex-shrink: 0;
            margin-left: auto;
            margin-right: 8px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }
        .appbar-actions {
            display: flex;
            gap: 4px;
            flex-wrap: nowrap;
            align-items: center;
        }
        .appbar-btn {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: white;
            padding: 4px 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.15s;
            font-size: 0.75rem;
            white-space: nowrap;
        }
        .appbar-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.03);
        }
        .appbar-select {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 4px 6px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.7rem;
            cursor: pointer;
        }
        .appbar-select option {
            color: #1e293b;
            background: white;
        }
        .appbar-assistant-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            margin-top: 6px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            padding: 8px;
            color: white;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.2s;
        }
        .appbar-assistant-bar:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: scale(1.01);
        }
        .appbar-3d-btn {
            background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 100%) !important;
            color: #4c1d95 !important;
            border: 1px solid #cbd5e1 !important;
            border-bottom: 3px solid #94a3b8 !important;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.1) !important;
            font-weight: 900 !important;
        }
        .appbar-3d-btn:active {
            transform: translateY(2px);
            border-bottom-width: 1px !important;
        }
        .appbar-3d-assistant {
            background: linear-gradient(135deg, #7c3aed 0%, #5b21b6 100%) !important;
            border: 1px solid #9333ea !important;
            border-bottom: 4px solid #3b0764 !important;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.4) !important;
        }
        /* ====== البلاطات ====== */
        .view {
            display: block;
            padding: 16px;
            max-width: 800px;
            margin: 0 auto;
        }
        .view[hidden] {
            display: none !important;
        }
        .home-hero {
            text-align: center;
            margin-bottom: 24px;
        }
        .seal-home svg {
            width: 80px;
            height: 80px;
        }
        .home-title {
            font-size: 2rem;
            font-weight: 900;
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 8px 0;
        }
        .home-sub {
            color: #64748b;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .tiles {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
        }
        .tile {
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            padding: 16px 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .tile:hover {
            transform: translateY(-4px);
            border-color: #7c3aed;
            box-shadow: 0 8px 25px rgba(124, 58, 237, 0.15);
        }
        .tile-icon {
            font-size: 2rem;
        }
        .tile-title {
            font-weight: 900;
            font-size: 0.85rem;
            color: #1e293b;
        }
        .tile-subtitle {
            font-size: 0.6rem;
            color: #94a3b8;
        }
        /* ====== النافذة المنبثقة العامة ====== */
        #globalModal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            z-index: 99999;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.25s ease;
        }
        #globalModal.modal-open {
            display: flex !important;
        }
        .modal-box {
            background: white;
            border-radius: 24px;
            padding: 28px 24px;
            max-width: 580px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);
            border: 2px solid #7c3aed;
            position: relative;
            animation: slideUp 0.3s ease;
        }
        .modal-close {
            position: sticky;
            top: 0;
            float: left;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 2px 12px rgba(239, 68, 68, 0.3);
            transition: all 0.15s;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-close:hover {
            transform: scale(1.08);
            background: #dc2626;
        }
        .modal-body {
            margin-top: 12px;
            clear: both;
            text-align: right;
        }
        /* ====== أنيميشن ====== */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        /* ====== أدوات مساعدة ====== */
        .btn-primary {
            background: #7c3aed;
            color: white;
            border: none;
            padding: 10px 28px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
        }
        .btn-primary:hover {
            background: #6d28d9;
            transform: translateY(-2px);
        }
        .btn-secondary {
            background: #f1f5f9;
            color: #1e293b;
            border: 2px solid #e2e8f0;
            padding: 8px 20px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn-secondary:hover {
            background: #e2e8f0;
        }
        .text-muted {
            color: #94a3b8;
            font-size: 0.85rem;
        }
        .mt-12 {
            margin-top: 12px;
        }
        .mb-8 {
            margin-bottom: 8px;
        }
        .flex-center {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        /* ====== استجابة ====== */
        @media (max-width: 600px) {
            .tiles {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            }
            .appbar-title {
                font-size: 1rem;
            }
            .modal-box {
                padding: 20px 16px;
            }
            .home-title {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>

    <!-- ============================================================ -->
    <!--                      شريط التطبيق                              -->
    <!-- ============================================================ -->
    <header class="appbar" id="appbar">
        <div class="appbar-row">
            <span class="appbar-title">✨ الذكي ✨</span>
            <div class="appbar-actions">
                <button class="appbar-btn appbar-3d-btn" id="btnFontMinus" title="تصغير الخط">A-</button>
                <button class="appbar-btn appbar-3d-btn" id="btnFontPlus" title="تكبير الخط">A+</button>
                <select class="appbar-select appbar-3d-select" id="themeSelect" title="السمة">
                    <option value="purple">🟣 بنفسجي</option>
                    <option value="navy">🔵 كحلي</option>
                    <option value="blue">💙 أزرق</option>
                    <option value="green">💚 أخضر</option>
                    <option value="dark">⚫ داكن</option>
                </select>
            </div>
        </div>
        <button class="appbar-assistant-bar appbar-3d-assistant" id="btnAssistant" type="button">
            <span>🤖</span>
            <span>مساعدك الذكي</span>
        </button>
    </header>

    <!-- ============================================================ -->
    <!--                      الصفحة الرئيسية                           -->
    <!-- ============================================================ -->
    <section class="view" id="view-home" data-view="home">
        <div class="home-hero">
            <div class="seal-home">
                <svg viewBox="0 0 64 64">
                    <circle cx="32" cy="32" r="30" fill="none" stroke="#7C3AED" stroke-width="2.5"/>
                    <circle cx="32" cy="32" r="20" fill="none" stroke="#A855F7" stroke-width="1.4"/>
                    <polygon points="32,9 36,22 50,22 39,31 43,44 32,36 21,44 25,31 14,22 28,22" fill="#7C3AED"/>
                </svg>
            </div>
            <h1 class="home-title">✨ الذكي ✨</h1>
            <p class="home-sub">دفتر التحضير الذكي — الإصدار 5.0</p>
        </div>

        <div class="tiles">
            <button class="tile" data-modal="settings">
                <span class="tile-icon">⚙️</span>
                <span class="tile-title">الإعدادات</span>
                <span class="tile-subtitle">تخصيص التطبيق</span>
            </button>
            <button class="tile" data-modal="help">
                <span class="tile-icon">📖</span>
                <span class="tile-title">تعليمات</span>
                <span class="tile-subtitle">دليل الاستخدام</span>
            </button>
            <button class="tile" data-modal="library">
                <span class="tile-icon">📚</span>
                <span class="tile-title">المكتبة</span>
                <span class="tile-subtitle">الموارد والكتب</span>
            </button>
            <button class="tile" data-modal="new-lesson">
                <span class="tile-icon">✏️</span>
                <span class="tile-title">تحضير جديد</span>
                <span class="tile-subtitle">خطط وسبورات</span>
            </button>
            <button class="tile" data-modal="archive">
                <span class="tile-icon">🗂️</span>
                <span class="tile-title">الأرشيف</span>
                <span class="tile-subtitle">الملفات المحفوظة</span>
            </button>
            <button class="tile" data-modal="bank">
                <span class="tile-icon">🗄️</span>
                <span class="tile-title">دروس واختبارات</span>
                <span class="tile-subtitle">ملخصات واختبارات</span>
            </button>
            <button class="tile" onclick="window.location.href='grades.html'">
                <span class="tile-icon">📊</span>
                <span class="tile-title">الدرجات والحضور</span>
                <span class="tile-subtitle">سجلات الطلاب</span>
            </button>
            <button class="tile" onclick="window.location.href='schedule.html'">
                <span class="tile-icon">📅</span>
                <span class="tile-title">جدول الحصص</span>
                <span class="tile-subtitle">جدول تفاعلي</span>
            </button>
            <button class="tile" onclick="window.location.href='exams.html'">
                <span class="tile-icon">📝</span>
                <span class="tile-title">مُحرّر اختبارات</span>
                <span class="tile-subtitle">تصميم يدوي</span>
            </button>
            <button class="tile" onclick="window.location.href='platform.html'">
                <span class="tile-icon">🌐</span>
                <span class="tile-title">المنصة المدرسية</span>
                <span class="tile-subtitle">بوابة إرسال الملفات</span>
            </button>
            <button class="tile" id="btnSemesterPlan">
                <span class="tile-icon">🗓️</span>
                <span class="tile-title">الخطة الفصلية</span>
                <span class="tile-subtitle">خطة شاملة</span>
            </button>
            <button class="tile" onclick="window.location.href='oralexam.html'">
                <span class="tile-icon">🗣️</span>
                <span class="tile-title">الاختبارات الشفوية</span>
                <span class="tile-subtitle">قرعة عشوائية</span>
            </button>
            <button class="tile" id="btnSelfEval">
                <span class="tile-icon">📈</span>
                <span class="tile-title">التقييم الذاتي</span>
                <span class="tile-subtitle">قس أداءك</span>
            </button>
            <button class="tile" onclick="window.location.href='exam_solver.html'">
                <span class="tile-icon">🧮</span>
                <span class="tile-title">حل نماذج الاختبارات</span>
                <span class="tile-subtitle">شرح تفصيلي</span>
            </button>
        </div>
    </section>

    <!-- ============================================================ -->
    <!--                      النافذة المنبثقة العامة                   -->
    <!-- ============================================================ -->
    <div id="globalModal">
        <div class="modal-box">
            <button class="modal-close" id="modalCloseBtn">✕</button>
            <div class="modal-body" id="modalBody">
                <!-- المحتوى يُحقن هنا بواسطة JavaScript -->
            </div>
        </div>
    </div>

    <!-- ============================================================ -->
    <!--                      JavaScript الكامل (المُصحَّح)            -->
    <!-- ============================================================ -->
    <script>
        // ================================================================
        //  نظام النوافذ المنبثقة + جميع الوظائف المُصحَّحة
        // ================================================================

        (function() {
            'use strict';

            // ---- حماية من الأخطاء ----
            console.log('✅ تطبيق الذكي — جارٍ التحميل...');

            // ---- عناصر النافذة ----
            const modal = document.getElementById('globalModal');
            const modalBody = document.getElementById('modalBody');
            const closeBtn = document.getElementById('modalCloseBtn');

            // ---- دالة فتح النافذة (متاحة عالمياً) ----
            window.openModal = function(htmlContent) {
                try {
                    if (!modal || !modalBody) {
                        console.error('❌ عناصر النافذة غير موجودة!');
                        return;
                    }
                    modalBody.innerHTML = htmlContent || '<p class="text-muted">المحتوى غير متاح حالياً.</p>';
                    modal.classList.add('modal-open');
                    modal.style.display = 'flex';
                    document.body.style.overflow = 'hidden';
                } catch (error) {
                    console.error('❌ خطأ في فتح النافذة:', error);
                }
            };

            // ---- دالة إغلاق النافذة ----
            window.closeModal = function() {
                try {
                    if (!modal) return;
                    modal.classList.remove('modal-open');
                    modal.style.display = 'none';
                    document.body.style.overflow = '';
                } catch (error) {
                    console.error('❌ خطأ في إغلاق النافذة:', error);
                }
            };

            // ---- إغلاق بالضغط على الخلفية ----
            if (modal) {
                modal.addEventListener('click', function(e) {
                    if (e.target === modal) window.closeModal();
                });
            }

            // ---- إغلاق بزر الإغلاق ----
            if (closeBtn) {
                closeBtn.addEventListener('click', window.closeModal);
            }

            // ---- إغلاق بزر ESC ----
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') window.closeModal();
            });

            // ================================================================
            //  محتوى النوافذ لكل زر
            // ================================================================

            // ---- دالة مساعدة لإنشاء محتوى النوافذ ----
            function getModalContent(title, icon, details, extraButtons = '') {
                return `
                    <h3 style="color: #4C1D95; margin-bottom: 12px;">${icon} ${title}</h3>
                    <div style="color: #334155; line-height: 1.8;">
                        ${details}
                    </div>
                    <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px;">
                        <button class="btn-primary" onclick="window.closeModal()">إغلاق</button>
                        ${extraButtons}
                    </div>
                `;
            }

            // ---- 1. المساعد الذكي ----
            document.getElementById('btnAssistant').addEventListener('click', function() {
                window.openModal(getModalContent(
                    'مساعدك الذكي',
                    '🤖',
                    `
                        <p>أنا هنا لمساعدتك في تحضير الدروس، وإنشاء الاختبارات، وتنظيم خطتك التعليمية.</p>
                        <div style="background: #F3E8FF; padding: 14px; border-radius: 12px; margin: 14px 0; border-right: 4px solid #7C3AED;">
                            <p style="font-weight: 700; color: #4C1D95;">💡 يمكنك أن تطلب مني:</p>
                            <ul style="list-style: none; padding: 0; text-align: right;">
                                <li style="padding: 4px 0;">• تحضير درس كامل</li>
                                <li style="padding: 4px 0;">• إنشاء اختبار شامل</li>
                                <li style="padding: 4px 0;">• تلخيص وحدة دراسية</li>
                                <li style="padding: 4px 0;">• تصميم سبورة تفاعلية</li>
                            </ul>
                        </div>
                        <p class="text-muted">للحصول على مساعدة فورية، اضغط على أيقونة المساعد في أي وقت.</p>
                    `,
                    `<button class="btn-secondary" onclick="window.closeModal()">فهمت ✅</button>`
                ));
            });

            // ---- 2. الخطة الفصلية ----
            document.getElementById('btnSemesterPlan').addEventListener('click', function() {
                window.openModal(getModalContent(
                    'الخطة الفصلية الشاملة',
                    '🗓️',
                    `
                        <p style="font-weight: 700; color: #1e293b;">📌 خطة الفصل الدراسي</p>
                        <div style="background: #f1f5f9; padding: 12px; border-radius: 10px; margin: 10px 0;">
                            <p><strong>📚 المواد:</strong> الرياضيات، العلوم، اللغة العربية</p>
                            <p><strong>📅 المدة:</strong> 15 أسبوع</p>
                            <p><strong>🎯 الأهداف:</strong> تغطية 80% من المنهج</p>
                        </div>
                        <div style="background: #dbeafe; padding: 12px; border-radius: 10px; margin: 10px 0; border-right: 4px solid #3b82f6;">
                            <p style="font-weight: 700; color: #1e40af;">📝 الأسبوع القادم:</p>
                            <ul style="list-style: none; padding: 0; text-align: right;">
                                <li style="padding: 3px 0;">• الأحد: مراجعة عامة</li>
                                <li style="padding: 3px 0;">• الاثنين: اختبار تشخيصي</li>
                                <li style="padding: 3px 0;">• الثلاثاء: درس جديد (الوحدة 4)</li>
                            </ul>
                        </div>
                        <p class="text-muted">يمكنك تعديل الخطة من الإعدادات.</p>
                    `,
                    `<button class="btn-secondary" onclick="window.closeModal()">عرض التفاصيل</button>`
                ));
            });

            // ---- 3. التقييم الذاتي ----
            document.getElementById('btnSelfEval').addEventListener('click', function() {
                window.openModal(getModalContent(
                    'التقييم الذاتي',
                    '📈',
                    `
                        <p style="font-weight: 700; color: #1e293b;">قم بتقييم أدائك اليومي</p>
                        <div style="background: #f0fdf4; padding: 14px; border-radius: 12px; margin: 12px 0; border-right: 4px solid #22c55e;">
                            <p><strong>📊 مؤشرات الأداء:</strong></p>
                            <ul style="list-style: none; padding: 0; text-align: right;">
                                <li style="padding: 4px 0;">✅ الالتزام بالحضور: 95%</li>
                                <li style="padding: 4px 0;">✅ جودة التحضير: ممتازة</li>
                                <li style="padding: 4px 0;">✅ تفاعل الطلاب: جيد جداً</li>
                            </ul>
                        </div>
                        <div style="background: #fef2f2; padding: 12px; border-radius: 10px; margin: 10px 0; border-right: 4px solid #ef4444;">
                            <p><strong>⚠️ نقاط للتحسين:</strong></p>
                            <ul style="list-style: none; padding: 0; text-align: right;">
                                <li style="padding: 3px 0;">• زيادة الأنشطة التفاعلية</li>
                                <li style="padding: 3px 0;">• تنويع وسائل التقويم</li>
                            </ul>
                        </div>
                        <p class="text-muted">سجّل تقييمك اليومي لتحسين الأداء.</p>
                    `,
                    `<button class="btn-secondary" onclick="window.closeModal()">سجل تقييمي</button>`
                ));
            });

            // ---- 4. ربط جميع أزرار البلاطات (data-modal) ----
            document.querySelectorAll('[data-modal]').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    const modalId = this.getAttribute('data-modal');
                    const titles = {
                        'settings': 'الإعدادات ⚙️',
                        'help': 'التعليمات 📖',
                        'library': 'المكتبة 📚',
                        'new-lesson': 'تحضير جديد ✏️',
                        'archive': 'الأرشيف 🗂️',
                        'bank': 'دروس واختبارات 🗄️'
                    };
                    const contents = {
                        'settings': `
                            <p><strong>🛠️ إعدادات التطبيق</strong></p>
                            <div style="background: #f8fafc; padding: 12px; border-radius: 10px;">
                                <p>📌 <strong>السمة الحالية:</strong> <span id="currentThemeDisplay">بنفسجي</span></p>
                                <p>📌 <strong>حجم الخط:</strong> <span id="currentFontDisplay">24px</span></p>
                                <p>📌 <strong>وضع التطبيق:</strong> تعليمي</p>
                            </div>
                            <p class="text-muted mt-12">يمكنك تخصيص الإعدادات من شريط التطبيق أعلاه.</p>
                        `,
                        'help': `
                            <p><strong>📖 دليل الاستخدام</strong></p>
                            <div style="background: #f1f5f9; padding: 12px; border-radius: 10px;">
                                <p>🚀 <strong>البداية:</strong> اختر أداة من البلاطات</p>
                                <p>📝 <strong>التحضير:</strong> استخدم "تحضير جديد" لإنشاء درس</p>
                                <p>🤖 <strong>المساعد:</strong> اضغط على شريط المساعد للحصول على مساعدة فورية</p>
                                <p>📊 <strong>التقييم:</strong> استخدم "التقييم الذاتي" لمتابعة أدائك</p>
                            </div>
                            <p class="text-muted mt-12">لتغيير حجم الخط، استخدم A+ و A- في الأعلى.</p>
                        `,
                        'library': `
                            <p><strong>📚 المكتبة التعليمية</strong></p>
                            <div style="background: #f0fdf4; padding: 12px; border-radius: 10px;">
                                <p>📘 <strong>الكتب المتاحة:</strong></p>
                                <ul style="list-style: none; padding: 0; text-align: right;">
                                    <li style="padding: 4px 0;">• دليل المعلم (الرياضيات)</li>
                                    <li style="padding: 4px 0;">• مرشد الطالب (العلوم)</li>
                                    <li style="padding: 4px 0;">• موسوعة الأنشطة</li>
                                </ul>
                            </div>
                            <p class="text-muted mt-12">سيتم إضافة المزيد من الموارد قريباً.</p>
                        `,
                        'new-lesson': `
                            <p><strong>✏️ تحضير درس جديد</strong></p>
                            <div style="background: #fefce8; padding: 12px; border-radius: 10px; border-right: 4px solid #eab308;">
                                <p><strong>📌 خطوات التحضير:</strong></p>
                                <ol style="padding-right: 20px; text-align: right;">
                                    <li style="padding: 4px 0;">اختر المادة الدراسية</li>
                                    <li style="padding: 4px 0;">حدد أهداف الدرس</li>
                                    <li style="padding: 4px 0;">صمم الأنشطة التعليمية</li>
                                    <li style="padding: 4px 0;">أضف وسائل التقويم</li>
                                </ol>
                            </div>
                            <p class="text-muted mt-12">يمكنك حفظ التحضير ومشاركته مع الزملاء.</p>
                        `,
                        'archive': `
                            <p><strong>🗂️ الأرشيف</strong></p>
                            <div style="background: #f1f5f9; padding: 12px; border-radius: 10px;">
                                <p>📁 <strong>الملفات المحفوظة:</strong></p>
                                <ul style="list-style: none; padding: 0; text-align: right;">
                                    <li style="padding: 4px 0;">• خطة الفصل الأول (2025)</li>
                                    <li style="padding: 4px 0;">• اختبارات الشهر الأول</li>
                                    <li style="padding: 4px 0;">• أنشطة إثرائية</li>
                                </ul>
                            </div>
                            <p class="text-muted mt-12">جميع الملفات محفوظة بشكل آمن.</p>
                        `,
                        'bank': `
                            <p><strong>🗄️ بنك الدروس والاختبارات</strong></p>
                            <div style="background: #fce7f3; padding: 12px; border-radius: 10px; border-right: 4px solid #ec4899;">
                                <p>📝 <strong>الموارد المتاحة:</strong></p>
                                <ul style="list-style: none; padding: 0; text-align: right;">
                                    <li style="padding: 4px 0;">• 50 اختباراً جاهزاً</li>
                                    <li style="padding: 4px 0;">• 100 خطة درس متنوعة</li>
                                    <li style="padding: 4px 0;">• 30 نشاطاً تفاعلياً</li>

                            </div>
                            <p class="text-muted mt-12">يمكنك استيراد وتصدير الموارد بسهولة.</p>
                        `
                    };
                    const title = titles[modalId] || 'معلومات';
                    const content = contents[modalId] || '<p>جاري تحميل المحتوى...</p>';
                    window.openModal(getModalContent(title, '', content));
                });
            });

            // ================================================================
            //  التحكم بحجم الخط
            // ================================================================

            const root = document.documentElement;
            let currentFontSize = 24; // القيمة الافتراضية

            function updateFontSize() {
                root.style.setProperty('--fz', currentFontSize + 'px');
                // تحديث العرض في النافذة إذا كانت مفتوحة
                const display = document.getElementById('currentFontDisplay');
                if (display) display.textContent = currentFontSize + 'px';
            }

            document.getElementById('btnFontPlus').addEventListener('click', function() {
                if (currentFontSize < 40) {
                    currentFontSize += 2;
                    updateFontSize();
                }
            });

            document.getElementById('btnFontMinus').addEventListener('click', function() {
                if (currentFontSize > 14) {
                    currentFontSize -= 2;
                    updateFontSize();
                }
            });

            // ================================================================
            //  التحكم بالسمة (الثيم)
            // ================================================================

            const themeSelect = document.getElementById('themeSelect');

            function applyTheme(theme) {
                try {
                    // تغيير السمة على العنصر الجذر
                    document.documentElement.setAttribute('data-theme', theme);

                    // تحديث ألوان شريط التطبيق
                    const appbar = document.getElementById('appbar');
                    const colors = {
                        'purple': ['#7c3aed', '#4c1d95'],
                        'navy': ['#1e3a5f', '#0f2440'],
                        'blue': ['#2563eb', '#1d4ed8'],
                        'green': ['#16a34a', '#15803d'],
                        'dark': ['#1e293b', '#0f172a']
                    };
                    const [color1, color2] = colors[theme] || colors['purple'];
                    if (appbar) {
                        appbar.style.background = `linear-gradient(135deg, ${color1}, ${color2})`;
                    }

                    // تحديث لون الخلفية للعناصر التي تستخدم التدرج
                    const heroTitle = document.querySelector('.home-title');
                    if (heroTitle) {
                        heroTitle.style.background = `linear-gradient(135deg, ${color1}, ${color2})`;
                        heroTitle.style.webkitBackgroundClip = 'text';
                        heroTitle.style.webkitTextFillColor = 'transparent';
                    }

                    // تحديث النافذة المنبثقة
                    const modalBox = document.querySelector('.modal-box');
                    if (modalBox) {
                        modalBox.style.borderColor = color1;
                    }

                    // تحديث العرض في النافذة إذا كانت مفتوحة
                    const display = document.getElementById('currentThemeDisplay');
                    const themeNames = {
                        'purple': 'بنفسجي',
                        'navy': 'كحلي',
                        'blue': 'أزرق',
                        'green': 'أخضر',
                        'dark': 'داكن'
                    };
                    if (display) display.textContent = themeNames[theme] || theme;

                    console.log(`✅ تم تطبيق السمة: ${theme}`);
                } catch (error) {
                    console.error('❌ خطأ في تطبيق السمة:', error);
                }
            }

            themeSelect.addEventListener('change', function() {
                const theme = this.value;
                applyTheme(theme);
                // حفظ التفضيل في localStorage
                try {
                    localStorage.setItem('preferred-theme', theme);
                } catch (e) { /* تجاهل أخطاء التخزين */ }
            });

            // ---- استعادة السمة المحفوظة ----
            try {
                const savedTheme = localStorage.getItem('preferred-theme');
                if (savedTheme && themeSelect) {
                    themeSelect.value = savedTheme;
                    applyTheme(savedTheme);
                } else {
                    // تطبيق السمة الافتراضية
                    applyTheme('purple');
                }
            } catch (e) {
                applyTheme('purple');
            }

            // ---- تطبيق السمة عند تحميل الصفحة ----
            window.addEventListener('load', function() {
                const currentTheme = document.documentElement.getAttribute('data-theme') || 'purple';
                if (themeSelect) {
                    themeSelect.value = currentTheme;
                    applyTheme(currentTheme);
                }
                // تحديث حجم الخط
                updateFontSize();
                console.log('✅ تم تحميل التطبيق بالكامل.');
            });

            // ================================================================
            //  معالجة الأخطاء العامة
            // ================================================================

            window.addEventListener('error', function(e) {
                console.error('❌ خطأ عام:', e.message);
                // عرض رسالة ودية للمستخدم في حالة الخطأ
                try {
                    if (modal && !modal.classList.contains('modal-open')) {
                        // لا نعطل التجربة إذا حدث خطأ بسيط
                    }
                } catch (err) {
                    // تجاهل
                }
            });

            console.log('✅ تطبيق الذكي — جاهز للاستخدام!');

        })();
    </script>
